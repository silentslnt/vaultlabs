<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaultLabs — Set New Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:'Inter',system-ui,sans-serif;background:#0c0c0c;color:#efefef;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
a{color:#3b82f6;text-decoration:none}a:hover{color:#5b9ef9}
.logo{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:32px;text-align:center}
.logo span{color:#3b82f6}
.card{width:100%;max-width:400px;background:#131313;border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:32px}
.card h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.card p{font-size:13px;color:rgba(255,255,255,.45);margin-bottom:28px;line-height:1.6}
.field{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.5);margin-bottom:6px}
input{width:100%;background:#1a1a1a;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:11px 14px;font-size:14px;font-family:inherit;color:#efefef;outline:none;transition:border-color .15s}
input:focus{border-color:rgba(59,130,246,.5)}
input::placeholder{color:rgba(255,255,255,.2)}
.btn{width:100%;background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s}
.btn:hover{background:#5b9ef9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:10px 14px;font-size:13px;color:#f87171;margin-bottom:16px;display:none}
.success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);border-radius:8px;padding:10px 14px;font-size:13px;color:#4ade80;margin-bottom:16px;display:none}
.invalid{text-align:center;padding:16px 0}
.invalid p{color:rgba(255,255,255,.45);font-size:14px;margin-bottom:20px}
</style>
</head>
<body>
<a href="../index.html" class="logo">Vault<span>Labs</span></a>
<div class="card" id="card">
  <div class="invalid" id="invalid-view" style="display:none">
    <p>This reset link is invalid or has expired.</p>
    <a href="forgot.html" class="btn" style="display:inline-block;text-align:center;width:auto;padding:11px 24px">Request a new link</a>
  </div>
  <div id="form-view">
    <h1>Set new password</h1>
    <p>Choose a strong password for your VaultLabs account.</p>
    <div class="error" id="error-msg"></div>
    <div class="success" id="success-msg"></div>
    <div class="field">
      <label>New password</label>
      <input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirm password</label>
      <input type="password" id="confirm" placeholder="Repeat your password" autocomplete="new-password">
    </div>
    <button class="btn" id="btn" onclick="doReset()">Save new password</button>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://qmoudajzycshbssdlczg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_TACZIaiyoxdTGv4QVoKPRg_Sax_NNAc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Supabase sends the reset token in the URL hash — exchange it for a session
sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    // Valid reset link — show form
    document.getElementById('form-view').style.display = '';
    document.getElementById('invalid-view').style.display = 'none';
  }
});

// Check on load — if no recovery token, show invalid state
window.addEventListener('load', () => {
  const hash = window.location.hash;
  if (!hash || (!hash.includes('access_token') && !hash.includes('type=recovery'))) {
    document.getElementById('form-view').style.display = 'none';
    document.getElementById('invalid-view').style.display = '';
  }
});

async function doReset() {
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const btn = document.getElementById('btn');
  const errEl = document.getElementById('error-msg');
  const sucEl = document.getElementById('success-msg');

  errEl.style.display = 'none';
  sucEl.style.display = 'none';

  if (!password || password.length < 8) {
    errEl.textContent = 'Password must be at least 8 characters.';
    errEl.style.display = 'block';
    return;
  }
  if (password !== confirm) {
    errEl.textContent = 'Passwords do not match.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Saving...';

  const { error } = await sb.auth.updateUser({ password });

  if (error) {
    errEl.textContent = error.message || 'Could not update password.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Save new password';
  } else {
    sucEl.textContent = 'Password updated. Redirecting to login...';
    sucEl.style.display = 'block';
    setTimeout(() => window.location.href = 'login.html', 2000);
  }
}
</script>
</body>
</html>
